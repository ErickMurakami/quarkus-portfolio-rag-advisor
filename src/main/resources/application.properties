quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_rag_advisor}
quarkus.datasource.jdbc.max-size=16
quarkus.hibernate-orm.database.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.swagger-ui.always-include=true
# Resume extraction (Using Groq)
quarkus.langchain4j.openai.base-url=${AI_BASE_URL:https://api.groq.io/v1}
quarkus.langchain4j.openai.api-key=${AI_API_KEY:dummy-api-key}
quarkus.langchain4j.openai.chat-model.model-name=${AI_CHAT_MODEL:openai/gpt-oss-20b}
quarkus.langchain4j.openai.chat-model.temperature=${LANGCHAIN_TEMPERATURE:1.0}
quarkus.langchain4j.openai.embedding-model.enabled=false
quarkus.http.limits.max-body-size=5M
# Voyage AI - Embeddings
gemini.api-key=${GEMINI_API_KEY:}
# Github API config
quarkus.rest-client.github-api.url=https://api.github.com
quarkus.rest-client.github-api.connect-timeout=5000
quarkus.rest-client.github-api.read-timeout=10000
github.token=${GITHUB_TOKEN:}