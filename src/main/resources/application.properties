quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_rag_advisor}
quarkus.datasource.jdbc.max-size=16

quarkus.hibernate-orm.database.schema-management.strategy=validate

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Resume extraction (Using Groq)
quarkus.langchain4j.openai.base-url=${GROQ_BASE_URL:https://api.groq.io/v1}
quarkus.langchain4j.openai.api-key=${GROQ_API_KEY:dummy-api-key}
quarkus.langchain4j.openai.chat-model.model-name=${GROQ_CHAT_MODEL:gpt-4o-mini}
quarkus.langchain4j.openai.chat-model.temperature=${quarkus.langchain4j.temperature:1.0}

quarkus.http.limits.max-body-size=5M