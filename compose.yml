
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: portfolio_rag_advisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d portfolio_rag_advisor
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles:
      - full

    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/portfolio_rag_advisor
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1/}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}

      QUARKUS_HTTP_HOST: 0.0.0.0

    ports:
      - "127.0.0.1:8000:8080"

volumes:
  postgres_data:
